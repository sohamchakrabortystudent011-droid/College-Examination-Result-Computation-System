<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a1f44">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a1f44'/%3E%3Cpath d='M29 12 17 6 5 12l12 6z M8 14.5V20c0 2 4 3.6 9 3.6s9-1.6 9-3.6v-5.5 M29 12v7' fill='none' stroke='white' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta http-equiv="refresh" content="1;url=CollegeExaminationSystem/index.html">
<title>West Bengal State University — Examination &amp; Result Computation System</title>
<style>
  :root{--navy:#0a1f44;--royal:#2b4fd8;--bg:#f3f6fb;--line:#e4e9f2;--muted:#667085}
  *{margin:0;box-sizing:border-box}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:radial-gradient(900px 500px at 50% -10%,#e9efff,var(--bg));
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#1d2740}
  .card{background:#fff;border:1px solid #edf1f8;border-radius:20px;box-shadow:0 18px 50px rgba(10,31,68,.16);
        max-width:520px;width:100%;padding:42px 40px;text-align:center}
  .crest{width:74px;height:74px;border-radius:22px;display:flex;align-items:center;justify-content:center;
         margin:0 auto 20px;background:linear-gradient(150deg,var(--navy),var(--royal))}
  .crest svg{width:40px;height:40px;color:#fff}
  h1{font-size:22px;color:var(--navy);line-height:1.3;margin-bottom:8px}
  p{color:var(--muted);font-size:14px;line-height:1.6}
  .bar{height:4px;border-radius:99px;background:#e4e9f2;overflow:hidden;margin:22px 0 8px}
  .bar i{display:block;height:100%;width:40%;border-radius:99px;background:var(--royal);animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
  .btn{display:inline-flex;align-items:center;gap:9px;background:var(--navy);color:#fff;text-decoration:none;
       font-weight:600;font-size:14px;padding:12px 24px;border-radius:11px;margin-top:14px}
  .btn:hover{background:var(--royal)}
  .note{margin-top:18px;font-size:11.5px;color:#98a5bd}
</style>
<script>
  // immediate, non-blocking redirect to the application landing page
  try{ location.replace('CollegeExaminationSystem/index.html'); }catch(e){}
</script>
</head>
<body>
  <div class="card">
    <div class="crest">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/><path d="M22 10v6"/></svg>
    </div>
    <h1>College Examination &amp; Result Computation System</h1>
    <p>Opening the examination portal…</p>
    <div class="bar"><i></i></div>
    <p style="font-size:12.5px">If nothing happens, continue manually below.</p>
    <a class="btn" href="CollegeExaminationSystem/index.html">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      Open the Examination Portal
    </a>
    <p class="note">West Bengal State University (WBSU) · Barasat, West Bengal · IndexedDB prototype — browser-local storage</p>
  </div>
</body>
</html>
